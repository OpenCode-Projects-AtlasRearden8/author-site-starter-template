# Deploy the author site to GitHub Pages.
# Enable once under Settings -> Pages -> Source: "GitHub Actions".

name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload the site as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole repository IS the site: no build step anywhere.
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
